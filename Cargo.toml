[package]
name         = "chnroutes"
version      = "0.2.0"
edition      = "2024"
rust-version = "1.85.0"
description  = "Rust version of chnroutes (with more features), to bypass the VPN accessing CN IPs."
readme       = "./README.md"
homepage     = "https://github.com/lxl66566/chnroutes-rs"
repository   = "https://github.com/lxl66566/chnroutes-rs"
license      = "MIT"
keywords     = ["VPN", "bypass", "chnroutes", "route"]
categories   = ["network-programming"]

[lib]
name = "chnroutes"
path = "src/lib.rs"

[[bin]]
name              = "chnroutes"
path              = "src/main.rs"
required-features = ["bin"]

[[example]]
name = "basic"
path = "examples/basic.rs"

[dependencies]
clap              = { version = "4.6", features = ["derive"], optional = true }
futures-util      = "0.3"
ipnet             = "2.12"
log               = "0.4"
net-route         = "0.4"
netdev            = "0.46"
pretty_env_logger = { version = "0.5.0", optional = true }
reqwest           = { version = "0.13" }
thiserror         = "2"
tokio             = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
zstd              = "0.13"

[build-dependencies]
zstd = "0.13"

[features]
default = ["bin"]
bin     = ["clap", "pretty_env_logger"]

[lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[lints.rust]
unsafe_code           = "allow"
unused_qualifications = "warn"

[profile.release]
opt-level = "s"
strip     = true
lto       = true
panic     = "unwind"
